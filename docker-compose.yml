services:
  zb-reader:
    image: ghcr.io/zuoban/zb-reader
    ports:
      - "3000:3000"
    volumes:
      - zb-reader-data:/app/data
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      # Generate a secure secret: openssl rand -base64 32
      # Or use: node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET environment variable is required}
    restart: unless-stopped

volumes:
  zb-reader-data:
